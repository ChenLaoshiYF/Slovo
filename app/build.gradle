plugins { id 'com.android.application' version '8.4.2' }
android {
    namespace 'studio.tingye.reader'
    compileSdk 34
    androidResources { noCompress 'bin' }
    defaultConfig {
        applicationId 'studio.tingye.reader'
        minSdk 26
        testInstrumentationRunner 'studio.tingye.reader.SlovoChecks'
        targetSdk 34
        versionCode 13
        versionName '0.10.1'
    }
    def devKey = new File(System.getenv('LOCALAPPDATA') ?: '.', 'Tingye/keys/development.jks')
    signingConfigs {
        if (devKey.exists()) {
            previousDevelopment { storeFile devKey; storePassword 'android'; keyAlias 'tingye-debug'; keyPassword 'android' }
        }
    }
    splits { abi { enable true; reset(); include 'arm64-v8a','armeabi-v7a','x86_64'; universalApk true } }
    packaging { jniLibs { excludes += ['lib/x86/**'] } }
    buildTypes {
        debug { if (devKey.exists()) signingConfig signingConfigs.previousDevelopment }
        release { if (devKey.exists()) signingConfig signingConfigs.previousDevelopment }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
dependencies {
    implementation files('libs/tesseract4android-4.9.0.aar', 'libs/sherpa-onnx-1.12.17.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
}
